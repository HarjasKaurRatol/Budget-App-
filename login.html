<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sign in — Budget Snapshot</title>
    <link rel="icon" type="image/png" href="Frame 2.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="auth.js"></script>
    <style>
      .login-shell {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .login-card {
        width: 100%;
        max-width: 360px;
      }
      .login-card h2 {
        margin-bottom: 6px;
      }
      .login-error {
        color: var(--bad);
        font-size: 0.85rem;
        font-weight: 700;
        margin: -4px 0 4px;
        display: none;
      }
      .login-error.show {
        display: block;
      }
      .login-card .primary-button {
        width: 100%;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <section class="panel login-card">
        <p class="section-tag">Budget Snapshot</p>
        <h2>Sign in</h2>
        <p class="supporting-text">Enter your name and password to continue.</p>
        <form id="loginForm" class="stack-form">
          <label>
            Username
            <input id="usernameInput" name="username" type="text" autocomplete="username" autofocus required placeholder="Enter Name" />
          </label>
          <label>
            Password
            <input id="passwordInput" name="password" type="password" autocomplete="current-password" required placeholder="••••" />
          </label>
          <p class="login-error" id="errorMsg">Incorrect username or password.</p>
          <button type="submit" class="primary-button">Sign in</button>
        </form>
      </section>
    </div>
    <script>
      document.getElementById("loginForm").addEventListener("submit", function (e) {
        e.preventDefault();
        var username = document.getElementById("usernameInput").value.trim().toLowerCase();
        var password = document.getElementById("passwordInput").value;
        var user = window.BudgetAuth.USERS[username];
        document.getElementById("errorMsg").classList.remove("show");
        if (user && user.password === password) {
          localStorage.setItem(window.BudgetAuth.STORAGE_KEY, username);
          var params = new URLSearchParams(location.search);
          location.href = params.get("redirect") || "index.html";
        } else {
          document.getElementById("errorMsg").classList.add("show");
        }
      });
    </script>
  </body>
</html>
