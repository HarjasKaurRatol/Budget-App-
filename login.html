<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0d0d0f; color: #f5f5f7; }
      .card { background: #1a1a1d !important; border-color: #2a2a2e !important; }
      input { background: #111 !important; color: #f5f5f7 !important; border-color: #333 !important; }
    }
    .card {
      width: 100%;
      max-width: 320px;
      padding: 32px 28px;
      background: #fff;
      border: 1px solid #e5e5e7;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
    h1 { font-size: 1.15rem; margin: 0 0 20px; }
    input {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: #0071e3;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #0077ed; }
    .error {
      color: #d92c2c;
      font-size: 0.85rem;
      margin: -6px 0 12px;
      display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Enter password</h1>
    <p class="error" id="errorMsg">Incorrect password.</p>
    <form method="POST" action="/api/login">
      <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required />
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("error")) {
      document.getElementById("errorMsg").classList.add("show");
    }
  </script>
</body>
</html>
